:root{
  --water:#E8ECEA; --land:#F6F7F4; --land-edge:#DCE3E0;
  --surface:#FFFFFF; --surface-2:#F1F4F3; --fg:#17201E; --muted:#5D6B68; --line:#DDE4E2;
  --accent:#2D7A6A; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --danger:#B42318; --warn:#9A6200;
  --shadow:0 10px 30px rgba(14,30,27,.16),0 2px 6px rgba(14,30,27,.08);
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#161C1B; --land:#1D2523; --land-edge:#2A3532;
  --surface:#161D1C; --surface-2:#202928; --fg:#E7EEEC; --muted:#9AAAA6; --line:#2E3A38;
  --accent:#5DBBA6; --accent-ink:#0B1715; --accent-soft:#1E3A34;
  --danger:#FF8A7A; --warn:#F2B84B;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#161C1B; --land:#1D2523; --land-edge:#2A3532;
  --surface:#161D1C; --surface-2:#202928; --fg:#E7EEEC; --muted:#9AAAA6; --line:#2E3A38;
  --accent:#5DBBA6; --accent-ink:#0B1715; --accent-soft:#1E3A34;
  --danger:#FF8A7A; --warn:#F2B84B;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--water);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
/* Layout: full-bleed street map; a floating planner panel (left on desktop, bottom sheet on phones). Verdigris accent, after the copper spires. */
:root{
  --water:#E8ECEA; --land:#F6F7F4; --land-edge:#DCE3E0;
  --surface:#FFFFFF; --surface-2:#F1F4F3; --fg:#17201E; --muted:#5D6B68; --line:#DDE4E2;
  --accent:#2D7A6A; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --danger:#B42318; --warn:#9A6200;
  --shadow:0 10px 30px rgba(14,30,27,.16),0 2px 6px rgba(14,30,27,.08);
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#161C1B; --land:#1D2523; --land-edge:#2A3532;
  --surface:#161D1C; --surface-2:#202928; --fg:#E7EEEC; --muted:#9AAAA6; --line:#2E3A38;
  --accent:#5DBBA6; --accent-ink:#0B1715; --accent-soft:#1E3A34;
  --danger:#FF8A7A; --warn:#F2B84B;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#161C1B; --land:#1D2523; --land-edge:#2A3532;
  --surface:#161D1C; --surface-2:#202928; --fg:#E7EEEC; --muted:#9AAAA6; --line:#2E3A38;
  --accent:#5DBBA6; --accent-ink:#0B1715; --accent-soft:#1E3A34;
  --danger:#FF8A7A; --warn:#F2B84B;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}
#map{position:fixed;inset:0;background:var(--water);font-family:var(--font)}
.leaflet-container{background:var(--water);font-family:var(--font)}
.leaflet-top{top:env(safe-area-inset-top,0px)}
.leaflet-right{right:env(safe-area-inset-right,0px)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bar a,.mapbtn{background:var(--surface);color:var(--fg);border-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.mapctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mapbtn{font:600 12px/1 var(--font);padding:9px 11px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.mapbtn:hover{background:var(--surface-2)}
.layers{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;display:grid;gap:4px;font-size:13px}
.layers label{display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45;min-width:190px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-container a.btn{color:var(--fg)}
.leaflet-container a.btn.primary{color:var(--accent-ink)}
.pop h4{margin:0 0 2px;font-size:15px;font-weight:700;text-wrap:balance}
.pop .sub{color:var(--muted);font-size:12px}
.pop .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dlabel{color:var(--muted);font:700 10.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;opacity:.75;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.slabel{color:var(--fg);font:600 11px/1 var(--font);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land);pointer-events:none}
.plabel{color:var(--fg);font:700 11.5px/1 var(--font);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land);pointer-events:none}
#map[data-z="lo"] .slabel,#map[data-z="lo"] .plabel,#map[data-z="mid"] .slabel{display:none}
#map[data-z="lo"] .dlabel.minor{display:none}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);color:#fff;font:800 12px/1 var(--font)}
.pin.me{outline:3px solid var(--accent);outline-offset:1px}
.destpin{width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.meetpin{width:26px;height:26px;border-radius:8px;background:var(--surface);border:2px dashed var(--accent);display:grid;place-items:center;color:var(--accent);font:800 13px/1 var(--font)}

/* Panel */
#panel{position:fixed;z-index:1000;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:384px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:16px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.brand .sp{flex:1;min-width:0}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:700 11px/1 var(--font);padding:6px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:#2F9E44;box-shadow:0 0 0 3px color-mix(in srgb,#2F9E44 25%,transparent)}
.status.local i{background:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--font);padding:9px 6px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .n{display:inline-block;min-width:18px;padding:2px 5px;margin-left:4px;border-radius:9px;background:var(--line);font-size:11px;font-variant-numeric:tabular-nums}
.pb>*{flex-shrink:0}
[hidden]{display:none!important}
.pb{flex:1;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.handle{display:none}

/* Generic controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px/1.1 var(--font);padding:9px 12px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{font-size:12px;padding:6px 9px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=time],select,textarea{width:100%;font:500 16px/1.3 var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input::placeholder,textarea::placeholder{color:var(--muted)}
label.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.err{font-size:12px;color:var(--danger)}
.ok{font-size:12px;color:var(--accent);font-weight:600}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.card.soft{background:var(--surface-2);border-color:transparent}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;text-align:left}
.empty b{font-size:14px}
h3.sec{margin:4px 0 0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* People */
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px/1 var(--font)}
.person .nm{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.person .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .lb{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 6px;font:600 12px/1.2 var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.picklist{display:grid;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.picklist button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:transparent;color:var(--fg);padding:7px 8px;border-radius:7px;font:500 13px/1.25 var(--font);cursor:pointer}
.picklist button:hover{background:var(--surface-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* Places */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 10px;font:600 12px/1 var(--font);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chips button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.chips button[aria-pressed="false"] .dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
.plist{display:grid;gap:2px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;border:0;background:transparent;color:var(--fg);text-align:left;font:inherit;width:100%}
.pitem:hover{background:var(--surface-2)}
.pitem.sel{background:var(--accent-soft)}
.pitem .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .c{font-size:12px;color:var(--muted)}
.pitem .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pitem .m b{color:var(--fg);font-size:13px}

/* Plan */
.dest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.dest .t{font-size:16px;font-weight:800;line-height:1.2;text-wrap:balance}
.dest .c{font-size:12px;color:var(--muted)}
.itin{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.itin summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.itin summary::-webkit-details-marker{display:none}
.itin .tot{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.itin .tot small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}
.itin .who{font-weight:700;min-width:0}
.itin .leave{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.itin .leave b{color:var(--fg)}
.badges{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.badges .arr{color:var(--muted);font-size:10px}
.bdg{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:5px;font:800 11px/1 var(--font);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.bdg.walk,.bdg.bike{background:var(--surface-2);color:var(--fg);font-weight:700}
.bdg.s{border-radius:50%;width:20px;padding:0;justify-content:center}
.steps{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:12px}
.step:last-child{padding-bottom:0}
.step .rail{display:flex;flex-direction:column;align-items:center}
.step .rail i{flex:1;width:3px;border-radius:2px;margin-top:4px}
.step .tx{font-size:13px;line-height:1.4}
.step .tx .d{color:var(--muted);font-size:12px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{font-size:12px;line-height:1.45;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.note.warn{color:var(--warn)}
.meet{display:grid;gap:6px}
.meetrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.meetrow .t{font-weight:700}
.meetrow .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

#banner{position:fixed;z-index:1100;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--surface);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-weight:600;max-width:calc(100vw - 32px)}
#banner .btn{background:transparent;color:var(--surface);border-color:color-mix(in srgb,var(--surface) 40%,transparent)}
#toast{position:fixed;z-index:1200;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

@media (min-width:761px){ .leaflet-right{right:calc(env(safe-area-inset-right,0px) + 6px)} .leaflet-top{top:calc(env(safe-area-inset-top,0px) + 6px)} }
@media (max-width:760px){
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:min(58dvh,560px);border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.min{height:auto}
  #panel.min .pb{display:none}
  #panel.min .tabs{display:none}
  .ph,.pb{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ph{padding-top:6px}
  .handle{display:block;justify-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);border:0;cursor:pointer;padding:0;margin:2px 0 2px}
  .brand h1{font-size:16px}
  .leaflet-bottom{bottom:calc(min(58dvh,560px) + 4px)}
  body.sheetmin .leaflet-bottom{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.plabel{position:absolute;left:34px;top:6px}
.install{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
.install ol{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.45}
.install .code{letter-spacing:.06em;font-variant-numeric:tabular-nums;user-select:all}
.pin.stale{opacity:.55;filter:grayscale(.4)}
.hero{display:grid;gap:6px;padding:4px 2px}
.hero b{font-size:20px;font-weight:800;line-height:1.2;text-wrap:balance}
.btn.big{padding:14px 16px;font-size:15px;border-radius:12px;width:100%}
.btn[disabled]{opacity:.6;cursor:progress}
.mecard{gap:12px}
.mehead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.mehead .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.mehead .lb{font-size:12px;color:var(--muted)}
.av{position:relative}
.livedot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#2F9E44;border:2px solid var(--surface)}
.switch{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;cursor:pointer;font-size:13px;line-height:1.35}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.switch .thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .thumb{left:21px}
.switch input:focus-visible + .track{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .basetiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.8)}}
:root[data-theme="dark"] .basetiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.8)}

</style>
</head>
<body>
<div id="map" data-z="mid"></div>
<aside id="panel" aria-label="Trip planner">
  <div class="ph">
    <button class="handle" id="handle" aria-label="Show or hide the planner"></button>
    <div class="brand">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 L19 12 L17 12 L21 24 L18 24 L22 33 L8 33 L12 24 L9 24 L13 12 L11 12 Z" fill="var(--accent)"/><circle cx="15" cy="1.6" r="1.6" fill="var(--accent)"/></svg>
      <div class="sp"><h1 id="t-title">Copenhagen Trip</h1><div class="sub" id="statusbox"></div></div>
      <div class="lang" role="group" aria-label="Language"><button id="lang-en" type="button">EN</button><button id="lang-el" type="button">ΕΛ</button></div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-group" type="button"></button>
      <button role="tab" id="tab-places" type="button"></button>
      <button role="tab" id="tab-plan" type="button"></button>
    </div>
  </div>
  <div class="pb" id="body"></div>
</aside>
<div id="banner" hidden></div>
<div id="toast" hidden></div>

/* ---------------- Geometry & routing ---------------- */
const R=6371000,rad=x=>x*Math.PI/180;
function hav(a,b,c,d){const dl=rad(c-a),dn=rad(d-b);const h=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const WALK_MPM=80/1.3;          // 4.8 km/h with a 1.3 street-detour factor
const walkMin=m=>m/WALK_MPM;
const bikeMin=m=>m*1.2/250+3;   // 15 km/h, detour 1.2, +3 min to unlock/park
const MAXWALK=2600;             // metres considered for walking to/from a station
const KIND={metro:{v:700,dwell:.5,wait:2.5},strain:{v:850,dwell:.6,wait:4.5},regional:{v:1150,dwell:1,wait:8}};
const ST=NET.stations;         // id -> [name,lat,lon]
const LINES=NET.lines;
const BOUNDS={s:55.5,n:56.1,w:12.2,e:12.85};
// lines serving each station
const SERVES={};LINES.forEach(l=>new Set(l.s).forEach(s=>(SERVES[s]=SERVES[s]||[]).push(l)));

// Build graph: nodes = "S:<st>" and "L:<li>:<pos>:<dir>"
const G=new Map();const edge=(a,b,w,k)=>{if(!G.has(a))G.set(a,[]);G.get(a).push([b,w,k])};
LINES.forEach((l,li)=>{
  const K=KIND[l.kind],n=l.s.length;
  for(let p=0;p<n;p++){
    for(const dir of [1,-1]){
      const q=p+dir;
      if(q<0||q>=n)continue;
      const here="L:"+li+":"+p+":"+dir;
      edge("S:"+l.s[p],here,K.wait,"board");
      const d=hav(ST[l.s[p]][1],ST[l.s[p]][2],ST[l.s[q]][1],ST[l.s[q]][2]);
      const next="L:"+li+":"+q+":"+dir;
      edge(here,next,d/K.v+K.dwell,"ride");
      edge(next,"S:"+l.s[q],0,"alight");
    }
  }
  if(l.ring){const tt=(a,b)=>hav(ST[a][1],ST[a][2],ST[b][1],ST[b][2])/K.v+K.dwell;
    edge("L:"+li+":"+(n-1)+":1","L:"+li+":1:1",tt(l.s[0],l.s[1]),"ride");
    edge("L:"+li+":0:-1","L:"+li+":"+(n-2)+":-1",tt(l.s[0],l.s[n-2]),"ride");}
});
const SIDS=Object.keys(ST);
for(let i=0;i<SIDS.length;i++)for(let j=i+1;j<SIDS.length;j++){const a=ST[SIDS[i]],b=ST[SIDS[j]];const d=hav(a[1],a[2],b[1],b[2]);if(d<450){edge("S:"+SIDS[i],"S:"+SIDS[j],walkMin(d)+1,"xfer");edge("S:"+SIDS[j],"S:"+SIDS[i],walkMin(d)+1,"xfer")}}

class Heap{constructor(){this.a=[]}push(x){const a=this.a;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p}}pop(){const a=this.a;const top=a[0];const last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<a.length&&a[l][0]<a[m][0])m=l;if(r<a.length&&a[r][0]<a[m][0])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m}}return top}get size(){return this.a.length}}

const TREE_CACHE=new Map();
function treeFrom(lat,lon){
  const key=lat.toFixed(5)+","+lon.toFixed(5);
  if(TREE_CACHE.has(key))return TREE_CACHE.get(key);
  const dist=new Map(),prev=new Map(),h=new Heap();
  dist.set("O",0);h.push([0,"O"]);
  for(const s of SIDS){const d=hav(lat,lon,ST[s][1],ST[s][2]);if(d<=MAXWALK){const w=walkMin(d);if(w<(dist.get("S:"+s)??1e9)){dist.set("S:"+s,w);prev.set("S:"+s,["O","walk"]);h.push([w,"S:"+s])}}}
  while(h.size){const [d,u]=h.pop();if(d>(dist.get(u)??1e9))continue;for(const [v,w,k] of (G.get(u)||[])){const nd=d+w;if(nd<(dist.get(v)??1e9)-1e-9){dist.set(v,nd);prev.set(v,[u,k]);h.push([nd,v])}}}
  const tr={lat,lon,dist,prev};TREE_CACHE.set(key,tr);if(TREE_CACHE.size>60)TREE_CACHE.delete(TREE_CACHE.keys().next().value);return tr;
}
// Best time from a tree to a target point: {min, station|null, direct}
function timeTo(tr,lat,lon){
  const dd=hav(tr.lat,tr.lon,lat,lon);let best={min:walkMin(dd),st:null,direct:true,walkEnd:dd};
  for(const s of SIDS){const ds=tr.dist.get("S:"+s);if(ds==null)continue;const d=hav(ST[s][1],ST[s][2],lat,lon);if(d>MAXWALK)continue;const m=ds+walkMin(d);if(m<best.min-0.01)best={min:m,st:s,direct:false,walkEnd:d}}
  return best;
}
// Turn a tree + target into readable legs
function itinerary(tr,lat,lon){
  const b=timeTo(tr,lat,lon);
  const totalDist=hav(tr.lat,tr.lon,lat,lon);
  const res={total:b.min,legs:[],bike:bikeMin(totalDist),direct:b.direct};
  if(b.direct){res.legs.push({type:"walk",to:null,min:b.min,from:[tr.lat,tr.lon],toLL:[lat,lon]});return res}
  const path=[];let cur="S:"+b.st;while(cur&&cur!=="O"){const p=tr.prev.get(cur);path.push([cur,p?p[1]:null]);cur=p?p[0]:null}
  path.reverse(); // [[node, kindOfEdgeIntoNode]]
  let ride=null;
  const nodeSt=n=>{const p=n.split(":");if(p[0]==="S")return p[1];return LINES[+p[1]].s[+p[2]]};
  for(let i=0;i<path.length;i++){
    const [node,k]=path[i];
    if(k==="walk"){const s=nodeSt(node);res.legs.push({type:"walk",to:s,min:tr.dist.get(node),from:[tr.lat,tr.lon],toLL:[ST[s][1],ST[s][2]]})}
    else if(k==="board"){const p=node.split(":");ride={type:"ride",li:+p[1],dir:+p[3],stations:[LINES[+p[1]].s[+p[2]]],min:0,wait:KIND[LINES[+p[1]].kind].wait,t0:tr.dist.get(node)}}
    else if(k==="ride"&&ride){const p=node.split(":");ride.stations.push(LINES[+p[1]].s[+p[2]]);ride.min=tr.dist.get(node)-ride.t0}
    else if(k==="alight"&&ride){res.legs.push(ride);ride=null}
    else if(k==="xfer"){const prevNode=path[i-1][0];const s0=nodeSt(prevNode),s1=nodeSt(node);res.legs.push({type:"walk",xfer:true,to:s1,min:tr.dist.get(node)-tr.dist.get(prevNode),from:[ST[s0][1],ST[s0][2]],toLL:[ST[s1][1],ST[s1][2]]})}
  }
  res.legs.push({type:"walk",to:null,min:walkMin(b.walkEnd),from:[ST[b.st][1],ST[b.st][2]],toLL:[lat,lon],end:true});
  // describe ride legs, merging parallel services
  res.legs.forEach(L=>{if(L.type!=="ride")return;const l=LINES[L.li];L.kind=l.kind;L.color=l.color;
    const alts=LINES.filter(o=>{if(o.kind!==l.kind)return false;const n=o.s.length;for(let p=0;p<n;p++){let ok=true;for(let j=0;j<L.stations.length;j++){const q=p+j*L.dir;if(q<0||q>=n||o.s[q]!==L.stations[j]){ok=false;break}}if(ok)return true}return false});
    // direction for each alt
    L.services=alts.length?alts.map(o=>{let tgt=null;const n=o.s.length;for(let p=0;p<n;p++){let ok=true;for(let j=0;j<L.stations.length;j++){const q=p+j*L.dir;if(q<0||q>=n||o.s[q]!==L.stations[j]){ok=false;break}}if(ok){tgt=o.ring?null:(L.dir>0?o.s[n-1]:o.s[0]);break}}return {line:o,term:tgt}}):[{line:l,term:l.ring?null:(L.dir>0?l.s[l.s.length-1]:l.s[0])}];
  });
  return res;
}

};

/* ---------------- Sync (encrypted, through public Nostr relays) ---------------- */
const RELAYS=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net","wss://nostr.mom","wss://relay.nostr.net"];
const NKIND=30078;
let pool=null,sub=null,TAG="",AES=null,READY=Promise.resolve();
const enc8=new TextEncoder(),dec8=new TextDecoder();
const b64=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",enc8.encode(s)))}
async function encrypt(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},AES,enc8.encode(JSON.stringify(obj))));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out)}
async function decrypt(str){const u=unb64(str);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},AES,u.slice(12));return JSON.parse(dec8.decode(pt))}
let pending={};       // dkey -> object waiting to publish (latest wins)
async function publish(dkey,obj){
  pending[dkey]=obj;
  if(!pool||!navigator.onLine){S.sync="offline";renderHeader();return}
  const o=pending[dkey];delete pending[dkey];
  try{await READY;if(!AES)throw new Error("no trip");
    const ev=NT.finalizeEvent({kind:NKIND,created_at:Math.floor(Date.now()/1000),tags:[["d",TAG+":"+dkey],["t",TAG]],content:await encrypt(o)},SK);
    await Promise.any(pool.publish(RELAYS,ev,{maxWait:8000}));
    if(S.sync!=="synced"){S.sync="synced";renderHeader()}
  }catch(e){console.warn("publish",e);if(!pending[dkey])pending[dkey]=o;S.sync="offline";renderHeader()}
}
function flushPending(){for(const k of Object.keys(pending))publish(k,pending[k])}
async function onEvent(ev){
  try{
    const d=(ev.tags.find(x=>x[0]==="d")||[])[1]||"";if(!d.startsWith(TAG+":"))return;
    const kind=d.slice(TAG.length+1);const obj=await decrypt(ev.content);
    if(kind==="p"){const p=clean.person(ev.pubkey,obj);if(!p)return;const cur=S.people[ev.pubkey];if(cur&&cur.ts>=p.ts)return;S.people[ev.pubkey]=p}
    else if(kind==="s"){const sh=clean.shared(obj);if(!sh||sh.ts<=S.shared.ts)return;S.shared=sh}
    else return;
    cacheTrip();scheduleRender();
  }catch(e){/* not for this trip, or tampered */}
}
let rq=null;function scheduleRender(){if(rq)return;rq=setTimeout(()=>{rq=null;S.meet=null;renderAll()},120)}
function connect(){READY=connectInner();return READY}
async function connectInner(){
  if(sub){try{sub.close()}catch(e){}sub=null}
  if(!S.trip)return;
  const code=S.trip;
  const tag=NT.bytesToHex(await sha("cph-trip-tag:"+code)).slice(0,40);
  const key=await crypto.subtle.importKey("raw",await sha("cph-trip-key:"+code),"AES-GCM",false,["encrypt","decrypt"]);
  if(code!==S.trip)return;
  TAG=tag;AES=key;
  if(!pool)pool=new NT.SimplePool({enablePing:true,enableReconnect:true});
  S.sync="connecting";renderHeader();
  sub=pool.subscribe(RELAYS,{kinds:[NKIND],"#t":[TAG],since:Math.floor(Date.now()/1000)-90*86400},{
    onevent:onEvent,
    oneose:()=>{S.sync="synced";renderHeader();flushPending()},
  });
  setTimeout(()=>{if(S.sync==="connecting"){S.sync=navigator.onLine?"connecting":"offline";renderHeader()}},12000);
}
addEventListener("online",()=>{flushPending();if(S.sync==="offline"){S.sync="connecting";renderHeader();connect()}});
addEventListener("offline",()=>{S.sync="offline";renderHeader()});

function publishMe(extra){
  const cur=me()||{};
  const p={name:profile.name,color:profile.color,lat:cur.lat??null,lon:cur.lon??null,acc:cur.acc??null,at:cur.at||0,live:S.live,left:false,...extra,ts:Date.now()};
  S.people[PK]=clean.person(PK,p);cacheTrip();renderAll();
  return publish("p",p);
}
function publishShared(next){
  const sh={plan:next.plan,places:next.places.map(p=>({id:p.id.replace(/^c_/,""),name:p.name,lat:p.lat,lon:p.lon})),ts:Date.now()};
  S.shared={plan:next.plan,places:next.places,ts:sh.ts};cacheTrip();renderAll();
  return publish("s",sh);
}

let watchId=null,lastPub={t:0,lat:null,lon:null};
function locError(e){
  if(!window.isSecureContext)return t("locInsecure");
  if(!e||e.code===undefined)return t("locNone");
  return e.code===1?(IN_APP?t("locDeniedApp"):t("locDenied")):e.code===3?t("locTimeout"):t("locUnavail");
}
function onPosition(pos,force){
  const c=pos.coords;const now=Date.now();
  const moved=lastPub.lat==null?1e9:hav(lastPub.lat,lastPub.lon,c.latitude,c.longitude);
  S.locBusy=false;S.locErr="";
  if(!force&&now-lastPub.t<15000&&moved<200){return}
  if(!force&&moved<25&&now-lastPub.t<120000){return}
  lastPub={t:now,lat:c.latitude,lon:c.longitude};
  publishMe({lat:+c.latitude.toFixed(6),lon:+c.longitude.toFixed(6),acc:Math.round(c.accuracy||0),at:now});
}
function locateOnce(then){
  if(!("geolocation" in navigator)){S.locErr=t("locNone");renderBody();return}
  if(!window.isSecureContext){S.locErr=t("locInsecure");renderBody();return}
  S.locBusy=true;S.locErr="";renderBody();
  navigator.geolocation.getCurrentPosition(p=>{onPosition(p,true);if(then)then(p)},e=>{S.locBusy=false;S.locErr=locError(e);renderBody()},{enableHighAccuracy:true,timeout:20000,maximumAge:10000});
}
function setLive(on){
  S.live=on;store.set("cph.live",on);
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  if(on&&"geolocation" in navigator&&window.isSecureContext&&S.trip&&profile.name){
    watchId=navigator.geolocation.watchPosition(p=>onPosition(p,false),e=>{S.locErr=locError(e);if(e.code===1){S.live=false;store.set("cph.live",false)}renderBody()},{enableHighAccuracy:true,timeout:30000,maximumAge:15000});
  }
  if(me())publishMe({});else renderBody();
}

function lineBadge(l){if(l.kind==="metro")return '<span class="bdg" style="background:'+l.color+'">'+esc(l.name)+'</span>';if(l.kind==="strain")return '<span class="bdg s" style="background:'+l.color+'">S</span>';return '<span class="bdg" style="background:'+l.color+'">RE</span>'}
function stationBadges(s){const seen=new Set();return (SERVES[s]||[]).filter(l=>{const k=l.kind==="metro"?l.id:l.kind;if(seen.has(k))return false;seen.add(k);return true}).map(lineBadge).join("")}
function drawNetwork(){
  netLayer.clearLayers();stLayer.clearLayers();
  if(!S.layers.transit)return;
  const halo=css("--surface");
  const order={regional:0,strain:1,metro:2};
  [...LINES].sort((a,b)=>order[a.kind]-order[b.kind]).forEach(l=>{
    const ll=l.s.map(s=>[ST[s][1],ST[s][2]]);
    const w=l.kind==="metro"?4.5:l.kind==="strain"?3:2.5;
    L.polyline(ll,{pane:"lines",color:halo,weight:w+3,opacity:.75,interactive:false}).addTo(netLayer);
    L.polyline(ll,{pane:"lines",color:l.color,weight:w,opacity:l.kind==="metro"?.95:.8,dashArray:l.kind==="regional"?"7 5":null,lineCap:"round",lineJoin:"round",interactive:false}).addTo(netLayer);
  });
  for(const s of SIDS){
    const ls=SERVES[s]||[];const metro=ls.find(l=>l.kind==="metro");const inter=new Set(ls.map(l=>l.kind==="metro"?l.id:l.kind)).size>1;
    const m=L.circleMarker([ST[s][1],ST[s][2]],{pane:"lines",radius:inter?5.5:4,color:inter?"#1d2321":(metro?metro.color:ls[0].color),weight:2,fillColor:"#fff",fillOpacity:1});

    m.addTo(stLayer);
  }
}

const initials=n=>(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
function ago(ms){if(!ms)return "";const m=Math.floor((Date.now()-ms)/60000);if(m<1)return t("justNow");if(m<60)return t("minAgo",{n:m});const h=Math.floor(m/60);if(h<48)return t("hAgo",{n:h});return t("dAgo",{n:Math.floor(h/24)})}
function drawPeople(){
  peopleLayer.clearLayers();
  located().forEach(p=>{
    const mine=p.id===PK,stale=Date.now()-p.at>30*60000;
    if(p.acc&&p.acc>20&&p.acc<3000)L.circle([p.lat,p.lon],{radius:p.acc,color:p.color,weight:1,opacity:.5,fillColor:p.color,fillOpacity:.08,interactive:false}).addTo(peopleLayer);
    const m=L.marker([p.lat,p.lon],{zIndexOffset:mine?1000:500,icon:L.divIcon({className:"",html:'<div class="pin'+(mine?" me":"")+(stale?" stale":"")+'" style="background:'+p.color+'"><span>'+esc(initials(p.name))+'</span></div><div class="plabel">'+esc(mine?t("me"):p.name)+'</div>',iconSize:[30,30],iconAnchor:[15,32],popupAnchor:[0,-30]})});

  });

function hhmmMinus(hhmm,mins){const m=hhmm.match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;let x=(+m[1])*60+(+m[2])-Math.ceil(mins);x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}

function legBadge(L_){if(L_.type==="walk")return '<span class="bdg walk">'+walkIcon+Math.max(1,Math.round(L_.min))+'</span>';const seen=new Set();return L_.services.filter(s=>{const k=s.line.kind==="metro"?s.line.id:s.line.kind;if(seen.has(k))return false;seen.add(k);return true}).map(s=>lineBadge(s.line)).join("")}
function rideText(L_){const kind=L_.kind,names=[...new Set(L_.services.map(s=>s.line.kind==="metro"?s.line.name:kind==="strain"?t("strain"):t("regional")))];const label=names.join(" / ");
  if(L_.services.every(s=>s.line.ring))return t("rideRing",{l:label,n:ST[L_.stations[1]][0]});
  const terms=[...new Set(L_.services.filter(s=>s.term).map(s=>ST[s.term][0]))];return t("ride",{l:label,t:terms.join(" "+t("or")+" ")})}

  });

function computeMeet(){
  const trees=groupTrees();if(trees.length<2)return null;
  const cands=allPlaces().filter(p=>p.lat<55.75&&p.lat>55.61).concat(SIDS.filter(s=>ST[s][1]<55.75&&ST[s][1]>55.61&&ST[s][2]>12.48).map(s=>({id:"st_"+s,name:ST[s][0],cat:"station",lat:ST[s][1],lon:ST[s][2],st:s})));
  const scored=cands.map(p=>{const ts=trees.map(x=>timeTo(x.tr,p.lat,p.lon).min);const max=Math.max(...ts),avg=ts.reduce((a,b)=>a+b,0)/ts.length;return {place:p,lat:p.lat,lon:p.lon,max,avg,score:max+avg*.25}}).sort((a,b)=>a.score-b.score);
  const out=[];for(const c of scored){if(out.every(o=>hav(o.lat,o.lon,c.lat,c.lon)>500))out.push(c);if(out.length===3)break}
  return out;
}

  const text=lines.join("\n");
  if(IN_APP){try{window.CPHApp.share(text);return}catch(e){}}
  try{if(navigator.share){await navigator.share({title:t("title"),text:lines[0],url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text);toast(t("inviteCopied"))}catch(e){prompt("",text)}
}
body.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-place]");if(!b)return;
  const a=b.dataset.act;
  if(b.dataset.place){const p=searchItems("").find(x=>x.id===b.dataset.place);if(p)setDestination(p);return}
  if(b.dataset.cat){const c=b.dataset.cat;S.cats.has(c)?S.cats.delete(c):S.cats.add(c);renderAll();return}
  if(b.dataset.sort){S.sort=b.dataset.sort;renderBody();return}
  if(b.dataset.col){profile.color=b.dataset.col;store.set("cph.profile",profile);if(me()&&!S.editing)publishMe({});renderBody();return}
  if(b.dataset.meet){const c=S.meet[+b.dataset.meet];if(c)setDestination(c.place);return}
  switch(a){
    case "start":case "join":{
      const n=readName();if(!n){S.locErr=t("needName");renderBody();return}
      saveProfile();
      if(a==="start")goTrip(newCode());
      publishMe({});
      locateOnce(()=>{if(!store.get("cph.liveAsked",false)){store.set("cph.liveAsked",true);setLive(true)}fitGroup()});
      break}
    case "install":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;renderBody()})}break;
    case "joincode":{const c=(S.codeDraft||"").toLowerCase().replace(/[^a-z0-9]/g,"");if(!/^[a-z0-9]{8,32}$/.test(c)){S.codeErr=t("badCode");renderBody();return}S.codeErr="";S.codeDraft="";goTrip(c);break}
    case "locate":locateOnce(p=>map.flyTo([p.coords.latitude,p.coords.longitude],inArea({lat:p.coords.latitude,lon:p.coords.longitude})?15:10,{duration:.6}));break;
    case "editme":S.editing=true;S.draftName=null;renderBody();break;
    case "canceledit":S.editing=false;renderBody();break;
    case "saveprofile":{const n=readName();if(!n){S.locErr=t("needName");renderBody();return}saveProfile();S.editing=false;S.locErr="";publishMe({});toast(t("saved"));break}
    case "invite":invite();break;
    case "showp":{const p=S.people[b.dataset.id];if(p&&p.lat!=null){map.flyTo([p.lat,p.lon],inArea(p)?16:10,{duration:.6});collapsePanelOnPhone()}break}
    case "hide":S.hidden.add(b.dataset.id);store.set("cph.hidden",[...S.hidden]);renderAll();break;
    case "unhide":S.hidden.delete(b.dataset.id);store.set("cph.hidden",[...S.hidden]);renderAll();break;
    case "togglehidden":S.showHiddenList=!S.showHiddenList;renderBody();break;
    case "leave":S.confirmLeave=true;renderBody();break;
    case "leaveno":S.confirmLeave=false;renderBody();break;
    case "leaveyes":S.confirmLeave=false;setLive(false);publishMe({left:true,lat:null,lon:null}).finally(()=>{goTrip(null)});break;
    case "newtrip":setLive(false);goTrip(null);break;
    case "newplace":S.placeForm={name:"",lat:null,lon:null};renderBody();break;
    case "placeplace":S.placeForm.name=($("pl-name")||{}).value||"";S.placing="place";showBanner(t("tapPlace"));collapsePanelOnPhone();break;
    case "cancelplacef":S.placeForm=null;S.placing=null;hideBanner();renderBody();break;
    case "saveplacef":{const f=S.placeForm;f.name=(($("pl-name")||{}).value||f.name||"").trim();if(!f.name){f.err=t("placeName");renderBody();return}if(f.lat==null){f.err=t("tapPlace");renderBody();return}
      const np={id:"c_"+Date.now().toString(36),name:f.name.slice(0,60),cat:"custom",lat:+f.lat.toFixed(6),lon:+f.lon.toFixed(6),addr:""};
      S.placeForm=null;S.cats.add("custom");publishShared({plan:S.shared.plan,places:S.shared.places.concat(np)});toast(t("placeAdded"));break}
    case "toplaces":S.tab="places";renderAll();break;
    case "cleardest":publishShared({plan:{...S.shared.plan,dest:null},places:S.shared.places});break;
    case "meet":S.meet=computeMeet();renderBody();drawMeet();if(S.meet)map.flyToBounds(S.meet.map(c=>[c.lat,c.lon]).concat(inCity().map(p=>[p.lat,p.lon])),{padding:[40,40],maxZoom:15,duration:.6});break;
  }
});
body.addEventListener("input",e=>{const el=e.target;if(el.id==="join-code"){S.codeDraft=el.value;return}if(el.id==="pf-name"){S.draftName=el.value;return}if(el.id==="pl-q"){S.q=el.value;renderBody()}if(el.id==="pl-name"&&S.placeForm)S.placeForm.name=el.value});
body.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.pid)S.open[d.dataset.pid]=d.open},true);
body.addEventListener("change",e=>{
  if(e.target.id==="plan-time"){publishShared({plan:{...S.shared.plan,arriveBy:e.target.value},places:S.shared.places})}
  if(e.target.id==="live-toggle"){setLive(e.target.checked)}
});

["group","places","plan"].forEach(k=>$("tab-"+k).onclick=()=>{S.tab=k;renderAll();expandPanel()});
$("lang-en").onclick=()=>{LANG="en";store.set("cph.lang","en");renderAll()};
$("lang-el").onclick=()=>{LANG="el";store.set("cph.lang","el");renderAll()};
$("handle").onclick=()=>{$("panel").classList.toggle("min");sheetSync()};
L.DomEvent.disableScrollPropagation($("panel"));L.DomEvent.disableClickPropagation($("panel"));

/* ---------------- Boot ---------------- */
function goTrip(code){
  S.trip=code;S.meet=null;S.open={};S.tab="group";
  if(code)history.replaceState(null,"","#"+code);else history.replaceState(null,"",location.pathname+location.search);
  store.set("cph.lastTrip",code);
  if(code){loadTripCache();connect()}else{if(sub){try{sub.close()}catch(e){}sub=null}S.people={};S.shared={plan:{dest:null,arriveBy:""},places:[],ts:0}}
  renderAll();
  if(code&&profile.name&&me()&&S.live)setLive(true);
  setTimeout(()=>{if(inCity().length||S.shared.plan.dest)fitGroup();else if(window.innerWidth<=760)map.panBy([0,Math.round(window.innerHeight*.25)],{animate:false})},60);
}
addEventListener("hashchange",()=>{const c=tripFromHash();if(c!==S.trip)goTrip(c)});
setInterval(()=>{if(document.visibilityState==="visible"&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))renderAll()},60000);
goTrip(tripFromHash()||store.get("cph.lastTrip",null));
if(!IN_APP&&"serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
